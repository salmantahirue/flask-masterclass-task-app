{% extends "learn_base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<div class="content-container">
<h1>Categories</h1>
<p><a href="{{ url_for('web.category_new') }}" class="btn btn-primary">New Category</a></p>
{% if categories %}
<ul class="category-list">
    {% for cat in categories %}
    <li>
        <a href="{{ url_for('web.task_list') }}?category_id={{ cat.id }}">{{ cat.name }}</a>
        <a href="{{ url_for('web.category_edit', category_id=cat.id) }}" class="btn btn-sm">Edit</a>
        <form method="post" action="{{ url_for('web.category_delete', category_id=cat.id) }}" style="display:inline;" onsubmit="return confirm('Delete this category?');">
            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
        </form>
    </li>
    {% endfor %}
</ul>
{% else %}
<p>No categories. <a href="{{ url_for('web.category_new') }}">Create one</a>.</p>
{% endif %}
</div>
{% endblock %}
